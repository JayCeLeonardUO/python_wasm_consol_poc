<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Console</title>
<meta name="description" content="A CPython REPL running entirely in the browser via WebAssembly (Pyodide). No server, no Docker.">
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --fg: #e6e6e6;
    --dim: #8b93a7;
    --prompt: #7ee787;
    --cont: #d2a8ff;
    --err: #ff7b72;
    --accent: #58a6ff;
    --border: #2a3040;
    --font: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header h1 span { color: var(--dim); font-weight: 400; }
  #status { color: var(--dim); font-size: 12px; }
  #status.ready { color: var(--prompt); }
  #status.error { color: var(--err); }
  #term {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 24px;
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
  }
  .line { min-height: 1.45em; }
  .prompt { color: var(--prompt); user-select: none; }
  .prompt.cont { color: var(--cont); }
  .stderr { color: var(--err); }
  .info { color: var(--dim); }
  .result { color: var(--accent); }
  #inputrow { display: flex; align-items: flex-start; }
  #input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    color: var(--fg);
    font: inherit;
    padding: 0;
    margin: 0;
    resize: none;
    overflow: hidden;
    caret-color: var(--fg);
  }
  #input:disabled { opacity: .5; }
  footer {
    padding: 6px 16px;
    font-size: 12px;
    color: var(--dim);
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  kbd {
    background: var(--border);
    border-radius: 3px;
    padding: 0 4px;
    font: inherit;
    font-size: 11px;
  }
  @media (max-width: 600px) { body { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <h1>Python Console <span>· CPython on WebAssembly, client-side only</span></h1>
  <div id="status">Loading Pyodide runtime…</div>
</header>

<div id="term" aria-live="polite">
  <div id="inputrow">
    <span id="ps" class="prompt">&gt;&gt;&gt; </span>
    <textarea id="input" rows="1" autocomplete="off" spellcheck="false" autofocus disabled></textarea>
  </div>
</div>

<footer>
  <div><kbd>Enter</kbd> run · <kbd>Shift+Enter</kbd> newline · <kbd>↑</kbd>/<kbd>↓</kbd> history · <kbd>Ctrl+L</kbd> clear · <kbd>Ctrl+C</kbd> cancel input</div>
  <div id="pyver"></div>
</footer>

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
<script>
(async () => {
  const term = document.getElementById("term");
  const inputRow = document.getElementById("inputrow");
  const input = document.getElementById("input");
  const ps = document.getElementById("ps");
  const status = document.getElementById("status");
  const pyver = document.getElementById("pyver");

  // ---- output helpers -------------------------------------------------------
  function write(text, cls) {
    if (!text) return;
    openLine = null;
    const div = document.createElement("div");
    div.className = "line" + (cls ? " " + cls : "");
    div.textContent = text.replace(/\n$/, "");
    term.insertBefore(div, inputRow);
    term.scrollTop = term.scrollHeight;
  }
  // Stream stdout/stderr: chunks without a trailing newline stay on the same line.
  let openLine = null, openCls = null;
  function stream(text, cls) {
    if (!text) return;
    const parts = text.split("\n");
    for (let i = 0; i < parts.length; i++) {
      const isLast = i === parts.length - 1;
      if (isLast && parts[i] === "") { openLine = null; break; }
      if (!openLine || openCls !== (cls || "")) {
        openLine = document.createElement("div");
        openLine.className = "line" + (cls ? " " + cls : "");
        openCls = cls || "";
        term.insertBefore(openLine, inputRow);
      }
      openLine.textContent += parts[i];
      if (!isLast) openLine = null;
    }
    term.scrollTop = term.scrollHeight;
  }
  function echo(promptText, code, isCont) {
    openLine = null;
    const div = document.createElement("div");
    div.className = "line";
    const p = document.createElement("span");
    p.className = "prompt" + (isCont ? " cont" : "");
    p.textContent = promptText;
    div.appendChild(p);
    div.appendChild(document.createTextNode(code));
    term.insertBefore(div, inputRow);
  }
  // Python 3.13's codeop reports some syntax errors via a private subclass; show the public name.
  function cleanTraceback(t) {
    return String(t ?? "").replace(/_IncompleteInputError/g, "SyntaxError");
  }
  function setPrompt(cont) {
    ps.textContent = cont ? "... " : ">>> ";
    ps.className = "prompt" + (cont ? " cont" : "");
  }
  function autosize() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  }
  term.addEventListener("click", (e) => {
    if (window.getSelection().toString() === "") input.focus();
  });

  // ---- boot Pyodide ---------------------------------------------------------
  const t0 = performance.now();
  let pyodide;
  try {
    pyodide = await loadPyodide();
  } catch (e) {
    status.textContent = "Failed to load Pyodide";
    status.className = "error";
    write(String(e), "stderr");
    return;
  }

  // Build a proper interactive console using Pyodide's own REPL machinery.
  // PyodideConsole handles incomplete statements, tracebacks and top-level await.
  const pyconsole = pyodide.runPython(`
from pyodide.console import PyodideConsole
import __main__
PyodideConsole(__main__.__dict__)
  `);
  const banner = pyodide.runPython("from pyodide.console import BANNER; BANNER");
  // Awaiting a PyProxy future destroys it, so we await this wrapper instead and keep
  // the original future alive long enough to read its formatted traceback.
  const awaitFut = pyodide.runPython(`
import builtins
from pyodide.console import repr_shorten

async def _await_fut(fut):
    res = await fut
    if res is None:
        return None
    builtins._ = res
    return repr_shorten(res)
_await_fut
  `);

  pyconsole.stdout_callback = (s) => stream(s);
  pyconsole.stderr_callback = (s) => stream(s, "stderr");

  const version = pyodide.runPython("import sys; sys.version.split()[0]");
  const loadMs = Math.round(performance.now() - t0);
  status.textContent = `Ready · Python ${version} · loaded in ${loadMs} ms`;
  status.className = "ready";
  pyver.textContent = `Pyodide ${pyodide.version} · CPython ${version} · wasm32`;

  write(banner, "info");
  write("Everything you type runs in this tab. No network calls after load, no server, no Docker.", "info");
  write("Try: import sys; sys.platform   |   await micropip.install('requests') after import micropip", "info");

  input.disabled = false;
  input.focus();

  // ---- REPL loop ------------------------------------------------------------
  const history = [];
  let histIdx = 0;
  let busy = false;
  let inContinuation = false;

  async function submit() {
    if (busy) return;
    const code = input.value;
    input.value = "";
    autosize();

    // Echo each physical line with the correct prompt.
    const lines = code.split("\n");
    lines.forEach((ln, i) => echo(i === 0 && !inContinuation ? ">>> " : "... ", ln, inContinuation || i > 0));

    if (code.trim() !== "") {
      history.push(code);
    }
    histIdx = history.length;

    busy = true;
    input.disabled = true;
    try {
      for (const ln of lines) {
        const fut = pyconsole.push(ln);
        const check = fut.syntax_check;
        if (check === "incomplete") {
          inContinuation = true;
          continue;
        }
        inContinuation = false;
        if (check === "syntax-error") {
          write(cleanTraceback(fut.formatted_error), "stderr");
          fut.destroy();
          continue;
        }
        const wrapped = awaitFut(fut);
        try {
          const shown = await wrapped;
          if (shown != null) write(shown, "result");
        } catch (e) {
          if (e.constructor.name === "PythonError") {
            write(cleanTraceback(fut.formatted_error || e.message), "stderr");
          } else {
            write(String(e), "stderr");
          }
        } finally {
          fut.destroy();
        }
      }
    } finally {
      busy = false;
      input.disabled = false;
      setPrompt(inContinuation);
      input.focus();
      term.scrollTop = term.scrollHeight;
    }
  }

  function cancelInput() {
    if (inContinuation) {
      pyconsole.buffer.clear?.();          // drop partially-entered block
      // buffer is a Python list; clear() is exposed as a method
    }
    inContinuation = false;
    input.value = "";
    autosize();
    setPrompt(false);
    write("KeyboardInterrupt", "stderr");
  }

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submit();
    } else if (e.key === "ArrowUp" && (input.selectionStart === 0 || !input.value.includes("\n"))) {
      if (histIdx > 0) {
        e.preventDefault();
        histIdx--;
        input.value = history[histIdx];
        autosize();
        requestAnimationFrame(() => input.setSelectionRange(input.value.length, input.value.length));
      }
    } else if (e.key === "ArrowDown" && (!input.value.includes("\n") || input.selectionStart === input.value.length)) {
      if (histIdx < history.length) {
        e.preventDefault();
        histIdx++;
        input.value = histIdx === history.length ? "" : history[histIdx];
        autosize();
      }
    } else if (e.key === "Tab") {
      e.preventDefault();
      const s = input.selectionStart, en = input.selectionEnd;
      input.value = input.value.slice(0, s) + "    " + input.value.slice(en);
      input.setSelectionRange(s + 4, s + 4);
      autosize();
    } else if (e.key === "l" && e.ctrlKey) {
      e.preventDefault();
      [...term.querySelectorAll(".line")].forEach((n) => n.remove());
    } else if (e.key === "c" && e.ctrlKey && window.getSelection().toString() === "") {
      e.preventDefault();
      cancelInput();
    }
  });
  input.addEventListener("input", autosize);
})();
</script>
</body>
</html>
